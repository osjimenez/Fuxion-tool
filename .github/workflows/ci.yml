name: CI

# Build and test on every push to main, every pull request and by hand, on Windows, Linux and macOS (plan S). Each
# runner also makes, from the same commit, what goes out of tool: fx as a native executable for the platforms it
# compiles (a dotnet tool package each, and an archive with the license) and, on Linux, Fuxion.Tool.Sdk and the main
# package of the tool. A push to main then waits for the approval of the user (the environment 'nuget' has the user as
# its required reviewer). Approved, it publishes all of it with one version: the packages to nuget.org, and the
# archives to the GitHub release release/X.Y.Z, with SHA256SUMS and an attestation. Rejected, or never approved,
# nothing goes out. A push that only changes what does not reach the build (documentation, the files of the coding
# agents) runs nothing (idea I-45; plan T).
#
# nuget.org: Trusted Publishing, no stored key. The policy of the owner OsJimenez (Fuxion.Tool*) trusts this workflow
# file (ci.yml) of osjimenez/Fuxion-tool in the environment 'nuget', which GitHub only allows on main; NuGet/login
# exchanges the OIDC token of the job for an API key that lasts one hour.

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '**/PACKAGE_README.md'
      - '!.claude/**'
      - '!.agents/**'
      - '!_fx/harness/**'
      - '!_fx/.inherited/harness/**'
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '**/PACKAGE_README.md'
      - '!.claude/**'
      - '!.agents/**'
      - '!_fx/harness/**'
      - '!_fx/.inherited/harness/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # a pull request: only its last push; main: every push runs, each with its own approval (a run waiting for one must
  # not hold the next ones)
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # the native executables: each runner the platforms the SDK of .NET compiles on it (AOT does not cross
          # operating systems; Windows x64 also makes win-arm64, macOS both)
          - os: windows-latest
            test: true
          - os: ubuntu-latest
            test: true
            sdk: true         # the SDK and the main package of fx come from here
          - os: ubuntu-24.04-arm
            test: false
          - os: macos-latest
            test: true
    runs-on: ${{ matrix.os }}
    # a step that hangs does not hold the runner for the six hours GitHub allows by default (a run takes about 15 minutes)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # the version comes from the tags and the commits since (fx version)
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          # the SDK 11 builds (the one of the workspace); the runtime 10 runs the net10.0 sample projects of the tests
          dotnet-version: |
            10.0.x
            11.0.100-rc.2.26504.105

      - name: Build
        run: dotnet build FxTool.slnx -c Release

      # every wait of the tests has its limit; this one is for all of them (on Windows they take about 9 minutes)
      - name: Test
        if: matrix.test
        run: dotnet test --solution FxTool.slnx -c Release --no-build --timeout 25m

      # the main package and those of the platforms of this runner, each with fx, its native executable
      - name: Pack fx
        run: dotnet pack solution/src/Tool/Fuxion.Tool.csproj -c Release -o artifacts/nupkgs

      - name: Pack Fuxion.Tool.Sdk
        if: matrix.sdk
        run: dotnet pack solution/src/Tool.Sdk/Fuxion.Tool.Sdk.csproj -c Release --no-build -o artifacts/nupkgs

      # the version that would go out, seen before approving: a notice at the top of the run, and in its summary (a tag
      # not pushed gives another version)
      - name: Version
        if: matrix.sdk
        run: |
          sdk=$(ls artifacts/nupkgs/Fuxion.Tool.Sdk.*.nupkg)
          version=${sdk##*/Fuxion.Tool.Sdk.}
          version=${version%.nupkg}
          echo "::notice title=Version::$version"
          echo "### Version $version (fx and Fuxion.Tool.Sdk)" >> "$GITHUB_STEP_SUMMARY"

      - name: The main package of fx, from one runner only
        if: '!matrix.sdk'
        shell: pwsh
        run: Get-ChildItem artifacts/nupkgs -Filter 'Fuxion.Tool.[0-9]*.nupkg' | Remove-Item

      # the archives of the release: the executable of each package (the same binary as on nuget.org) with the
      # license; a smoke test with the one of this platform
      - name: Archives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts/archives | Out-Null
          # the platform of this runner, as fx names them (RuntimeIdentifier may name the distribution: ubuntu.24.04-x64)
          $here = "$(if ($IsWindows) { 'win' } elseif ($IsMacOS) { 'osx' } else { 'linux' })-" +
            [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          foreach ($package in Get-ChildItem artifacts/nupkgs -Filter 'Fuxion.Tool.*.nupkg') {
            if ($package.Name -notmatch '^Fuxion\.Tool\.(?<rid>(win|linux|osx)-(x64|arm64))\.(?<version>.+)\.nupkg$') { continue }
            $rid = $Matches.rid; $version = $Matches.version
            $folder = Join-Path artifacts "fx-$rid"
            # a package is a zip (Expand-Archive wants the extension)
            Copy-Item $package.FullName "$folder.zip"
            Expand-Archive "$folder.zip" -DestinationPath $folder
            $windows = $rid.StartsWith('win-')
            $name = "fx$(if ($windows) { '.exe' })"
            $out = New-Item -ItemType Directory -Force (Join-Path $folder 'out')
            Copy-Item (Join-Path $folder "tools/any/$rid/$name"), LICENSE $out
            # the zip of a package keeps no permissions: on Linux and macOS, fx is made executable here
            $exe = Join-Path $out $name
            if ($windows) {
              Compress-Archive -Path (Join-Path $out '*') -DestinationPath "artifacts/archives/fx-$version-$rid.zip"
            }
            else {
              chmod +x $exe
              tar -czf "artifacts/archives/fx-$version-$rid.tar.gz" -C $out fx LICENSE
            }
            if ($rid -eq $here) {
              & $exe --version
              if ($LASTEXITCODE -ne 0) { throw "fx $rid does not run" }
            }
          }
          Get-ChildItem artifacts/archives

      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.os }}
          path: artifacts/nupkgs/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: archives-${{ matrix.os }}
          path: artifacts/archives/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: nuget
    # once approved (the wait for the approval does not count): the pushes, and the unlisting, which waits for nuget.org
    timeout-minutes: 30
    permissions:
      contents: write      # the tag and the release
      id-token: write      # the OIDC token: nuget.org (Trusted Publishing) and the attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: artifacts/nupkgs

      - uses: actions/download-artifact@v8
        with:
          pattern: archives-*
          merge-multiple: true
          path: artifacts/archives

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        run: |
          sdk=$(ls artifacts/nupkgs/Fuxion.Tool.Sdk.*.nupkg)
          version=${sdk##*/Fuxion.Tool.Sdk.}
          echo "version=${version%.nupkg}" >> "$GITHUB_OUTPUT"
          ls -l artifacts/nupkgs artifacts/archives

      - name: NuGet login (OIDC, temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: OsJimenez   # the profile name on nuget.org, not an email

      # the SDK (its .snupkg goes with it), fx of each platform, and last the main package of fx, which points to them;
      # a version already there (a run again) is not an error
      - name: Push to nuget.org
        env:
          VERSION: ${{ steps.version.outputs.version }}
          API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for id in Fuxion.Tool.Sdk Fuxion.Tool.win-x64 Fuxion.Tool.win-arm64 Fuxion.Tool.linux-x64 Fuxion.Tool.linux-arm64 \
                    Fuxion.Tool.osx-arm64 Fuxion.Tool.osx-x64 Fuxion.Tool; do
            dotnet nuget push "artifacts/nupkgs/$id.$VERSION.nupkg" --api-key "$API_KEY" \
              --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: SHA256SUMS
        working-directory: artifacts/archives
        run: sha256sum fx-* > SHA256SUMS && cat SHA256SUMS

      - name: Attestation
        uses: actions/attest@v4
        with:
          subject-path: artifacts/archives/fx-*

      # once (a run again, after a failure further on, finds it made)
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "release/$VERSION" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "The release release/$VERSION is there already."
          else
            gh release create "release/$VERSION" artifacts/archives/* --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" --title "fx $VERSION" --generate-notes
          fi

      # the packages of the platforms, unlisted: only Fuxion.Tool shows on nuget.org, and it asks for them by their exact
      # version, which an unlisted package still serves (the policy also has the scope to unlist). nuget.org may not
      # take it while it validates them: again, every 30 seconds for 15 minutes (the key lasts an hour)
      - name: Unlist the packages of the platforms
        env:
          VERSION: ${{ steps.version.outputs.version }}
          API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-arm64 osx-x64; do
            for attempt in $(seq 30); do
              if dotnet nuget delete "Fuxion.Tool.$rid" "$VERSION" --api-key "$API_KEY" \
                   --source https://api.nuget.org/v3/index.json --non-interactive; then
                break
              fi
              if [ "$attempt" = 30 ]; then echo "Fuxion.Tool.$rid $VERSION could not be unlisted." >&2; exit 1; fi
              sleep 30
            done
          done
